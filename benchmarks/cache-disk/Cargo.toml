[package]
name = "moat-cache-disk-compare"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
foyer = { git = "https://github.com/foyer-rs/foyer.git", rev = "dd46245c45071d1036331e4e2c48e15386017b96" }
futures-util = "0.3"
hdrhistogram = "7"
libc = "0.2"
moat-cache = { path = "../../core/moat-cache" }
moat-cache-memory = { path = "../../core/moat-cache-memory" }
moat-cache-store = { path = "../../core/moat-cache-store" }
moat-common = { path = "../../core/moat-common" }
moat-engine = { path = "../../core/moat-engine" }
moat-server = { path = "../../core/moat-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }

[profile.release]
debug = 1
